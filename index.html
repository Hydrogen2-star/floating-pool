<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>WATER FLOW</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;background:#101820;color:#f4f7fa;
  font-family:Arial,"Noto Sans JP",sans-serif;
  min-height:100vh;display:flex;justify-content:center;
  align-items:center;overflow:hidden;
}
#gameWrap{
  width:min(96vw,850px);display:flex;flex-direction:column;
  align-items:center;gap:10px;
}
#topbar{
  width:100%;display:flex;justify-content:space-between;
  align-items:center;gap:8px;flex-wrap:wrap;
}
.logo{font-size:clamp(19px,4vw,27px);font-weight:900;letter-spacing:2px;color:#72e5ff}
.stats{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:#c5d4df}
.stats strong{color:#fff;font-size:18px;margin-left:4px}
#canvasBox{
  width:min(94vw,690px);aspect-ratio:1/1;position:relative;
  background:#14232d;border:1px solid #344b59;border-radius:18px;
  overflow:hidden;box-shadow:0 12px 45px #0008;
}
canvas{width:100%;height:100%;display:block;touch-action:manipulation}
#hint{
  width:min(94vw,690px);font-size:12px;line-height:1.65;
  color:#aabdc9;text-align:center;
}
#overlay{
  position:absolute;inset:0;background:#08141de8;
  display:flex;align-items:center;justify-content:center;
  padding:20px;text-align:center;z-index:5;
}
.panel{max-width:440px;width:100%}
.panel h1{font-size:clamp(30px,7vw,48px);margin:0 0 8px;color:#72e5ff;letter-spacing:3px}
.panel h2{font-size:26px;margin:0 0 12px}
.panel p{font-size:14px;line-height:1.8;color:#c4d3dd;margin:10px 0 20px}
button{
  border:0;border-radius:10px;padding:13px 25px;
  background:#55d5f0;color:#08202a;font-size:16px;
  font-weight:bold;cursor:pointer;margin:5px;
}
button.secondary{background:#344b59;color:#f4f7fa}
button:active{transform:scale(.97)}
.small{font-size:11px!important;color:#91a8b6!important}
#mobileHelp{display:none}
@media(max-width:600px){
  #gameWrap{gap:7px}
  .stats{gap:9px;font-size:11px}
  .stats strong{font-size:15px}
  #hint{font-size:11px}
  #mobileHelp{display:block}
}
</style>
</head>
<body>
<div id="gameWrap">
  <div id="topbar">
    <div class="logo">WATER FLOW</div>
    <div class="stats">
      <div>TIME<strong id="time">0.0</strong></div>
      <div>LAP<strong id="lap">0</strong></div>
      <div>SPEED<strong id="speed">20.0s</strong></div>
      <div>FENCES<strong id="fences">0/3</strong></div>
    </div>
  </div>

  <div id="canvasBox">
    <canvas id="game" width="700" height="700"></canvas>
    <div id="overlay">
      <div class="panel" id="panel">
        <h1>WATER FLOW</h1>
        <p>
          水路を自動で周回するキャラクターを、柵で誘導しよう。<br>
          障害物を避けながら、できるだけ長く生き残れ！
        </p>
        <p>
          <b>柵の使い方</b><br>
          キャラクターの進行レーンに柵を置くと、隣のレーンへ移動。<br>
          2本の柵を組み合わせると、移動先を指定できる。<br>
          通過した場所の後ろに置くと、水流を弱めて減速させる。
        </p>
        <button id="startBtn">GAME START</button>
        <p class="small">PC：クリックで柵を設置 / スマホ：タップで設置</p>
      </div>
    </div>
  </div>

  <div id="hint">
    柵は最大3本。設置から一定時間で消滅します。<br>
    キャラクターが障害物に触れるとゲームオーバー。
    <span id="mobileHelp">水路上をタップして柵を設置しよう。</span>
  </div>
</div>

<script>
(() => {
"use strict";

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const W = 700, H = 700, CX = 350, CY = 350;

const ui = {
  time: document.getElementById("time"),
  lap: document.getElementById("lap"),
  speed: document.getElementById("speed"),
  fences: document.getElementById("fences"),
  overlay: document.getElementById("overlay"),
  panel: document.getElementById("panel")
};

const LANE = {
  0: {half:245, radius:75},
  1: {half:215, radius:65},
  2: {half:185, radius:55}
};

let paths = [];
let running = false;
let gameOver = false;
let lastTime = 0;
let elapsed = 0;
let lapCount = 0;
let lapTime = 20;
let lapProgress = 0;
let totalProgress = 0;
let playerLane = 1;
let player = {x:0,y:0,angle:0};
let fences = [];
let obstacles = [];
let particles = [];
let spawnTimer = 0;
let obstacleLevel = 0;
let wheelAngle = 0;
let bestTime = Number(localStorage.getItem("waterFlowBest") || 0);

const rand = (a,b) => a + Math.random()*(b-a);
const clamp = (v,a,b) => Math.max(a,Math.min(b,v));

function makeRoundedPath(half, radius) {
  const pts = [];
  const steps = 32;
  const addLine = (x1,y1,x2,y2,n=30) => {
    for(let i=0;i<=n;i++){
      const t=i/n;
      pts.push({x:x1+(x2-x1)*t,y:y1+(y2-y1)*t});
    }
  };
  const addArc = (cx,cy,r,a1,a2) => {
    for(let i=0;i<=steps;i++){
      const a=a1+(a2-a1)*i/steps;
      pts.push({x:cx+Math.cos(a)*r,y:cy+Math.sin(a)*r});
    }
  };

  const h=half, r=radius;
  addLine(-h+r,-h,h-r,-h);
  addArc(h-r,-h+r,r,-Math.PI/2,0);
  addLine(h,-h+r,h,h-r);
  addArc(h-r,h-r,r,0,Math.PI/2);
  addLine(h-r,h,-h+r,h);
  addArc(-h+r,h-r,r,Math.PI/2,Math.PI);
  addLine(-h,h-r,-h,-h+r);
  addArc(-h+r,-h+r,r,Math.PI,Math.PI*1.5);

  const cumulative=[0];
  let length=0;
  for(let i=1;i<pts.length;i++){
    length+=Math.hypot(pts[i].x-pts[i-1].x,pts[i].y-pts[i-1].y);
    cumulative.push(length);
  }
  return {pts,cumulative,length};
}

function pathPoint(lane,s) {
  const path=paths[lane];
  const target=((s%1)+1)%1*path.length;
  let lo=0,hi=path.cumulative.length-1;
  while(lo<hi){
    const mid=(lo+hi)>>1;
    if(path.cumulative[mid]<target) lo=mid+1;
    else hi=mid;
  }
  const i=Math.max(1,lo);
  const a=path.pts[i-1], b=path.pts[i];
  const d=path.cumulative[i]-path.cumulative[i-1];
  const t=d===0?0:(target-path.cumulative[i-1])/d;
  const x=a.x+(b.x-a.x)*t+CX;
  const y=a.y+(b.y-a.y)*t+CY;
  const angle=Math.atan2(b.y-a.y,b.x-a.x);
  return {x,y,angle};
}

function nearestTrack(x,y) {
  let best={distance:Infinity,lane:1,s:0};
  for(let lane=0;lane<3;lane++){
    const path=paths[lane];
    for(let i=0;i<path.pts.length;i++){
      const p=path.pts[i];
      const dx=x-(p.x+CX),dy=y-(p.y+CY);
      const d=dx*dx+dy*dy;
      if(d<best.distance){
        best.distance=d;
        best.lane=lane;
        best.s=path.cumulative[i]/path.length;
      }
    }
  }
  return best;
}

function normalizeDelta(a,b) {
  let d=(a-b+1)%1;
  if(d<0)d+=1;
  return d;
}

function lapTimeForLap(lap) {
  const targets=[20,18,16,15,14,13,12.5,12,11.5,11,10.5,10];
  if(lap<targets.length)return targets[lap];
  return 10;
}

function updateLapSpeed() {
  // 各周回の目標タイムへ滑らかに近づける
  const current=lapTimeForLap(lapCount);
  const next=lapTimeForLap(lapCount+1);
  const f=clamp(lapProgress,0,1);
  lapTime=current+(next-current)*f;
}

function startGame() {
  running=true;
  gameOver=false;
  elapsed=0;
  lapCount=0;
  lapTime=20;
  lapProgress=0;
  totalProgress=0;
  playerLane=1;
  fences=[];
  obstacles=[];
  particles=[];
  spawnTimer=1.8;
  obstacleLevel=0;
  wheelAngle=0;
  lastTime=performance.now();
  ui.overlay.style.display="none";
  updateUI();
  requestAnimationFrame(loop);
}

function endGame() {
  if(gameOver)return;
  running=false;
  gameOver=true;
  if(elapsed>bestTime){
    bestTime=elapsed;
    localStorage.setItem("waterFlowBest",String(bestTime));
  }
  ui.overlay.style.display="flex";
  ui.panel.innerHTML=`
    <h2>GAME OVER</h2>
    <p>
      生存時間：<b>${elapsed.toFixed(1)}秒</b><br>
      周回数：<b>${lapCount}</b><br>
      BEST：<b>${bestTime.toFixed(1)}秒</b>
    </p>
    <button id="retryBtn">RETRY</button>
    <p class="small">障害物を避けて、さらに長く生き残ろう。</p>
  `;
  document.getElementById("retryBtn").addEventListener("click",startGame);
}

function updateUI() {
  ui.time.textContent=elapsed.toFixed(1);
  ui.lap.textContent=lapCount;
  ui.speed.textContent=lapTime.toFixed(1)+"s";
  ui.fences.textContent=fences.length+"/3";
}

function addParticles(x,y,color,count=12) {
  for(let i=0;i<count;i++){
    const a=rand(0,Math.PI*2);
    const s=rand(30,130);
    particles.push({
      x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,
      life:rand(.25,.65),max:.65,color,size:rand(2,5)
    });
  }
}

function placeFence(x,y) {
  if(!running)return;
  const near=nearestTrack(x,y);
  if(near.distance>48*48)return;
  if(fences.length>=3)return;

  const fence={
    lane:near.lane,
    s:near.s,
    age:0,
    used:false,
    slow:false,
    slowEnd:0,
    id:Math.random()
  };

  // キャラクターが通過した直後の場所なら、減速用の弱流を発生させる
  const behind=normalizeDelta(lapProgress,near.s);
  const ahead=normalizeDelta(near.s,lapProgress);
  if(behind>0 && behind<0.11 && playerLane===near.lane){
    fence.slow=true;
    fence.slowEnd=(lapProgress+0.075)%1;
    fence.used=true;
    addParticles(x,y,"#8bdcff",7);
  } else {
    addParticles(x,y,"#d9f7ff",5);
  }

  fences.push(fence);
  updateUI();
}

function resolveFenceAtPlayer() {
  for(const f of fences){
    if(f.used || f.slow || f.lane!==playerLane)continue;

    const d=normalizeDelta(f.s,lapProgress);
    if(d<0.009 || d>0.991){
      // 同じ進行位置付近にある別レーンの柵を探す
      let paired=null;
      for(const other of fences){
        if(other===f || other.slow || other.used)continue;
        const sd=Math.abs(normalizeDelta(other.s,f.s));
        const close=Math.min(sd,1-sd);
        if(close<0.018 && Math.abs(other.lane-f.lane)===1){
          paired=other;
          break;
        }
      }

      let destination;
      if(paired){
        // 2本目の柵があるレーンへ移動する
        destination=paired.lane;
        paired.used=true;
      }else{
        // 1本だけなら隣のレーンへランダムに移動
        if(playerLane===0)destination=1;
        else if(playerLane===2)destination=1;
        else destination=Math.random()<.5?0:2;
      }

      const p=pathPoint(playerLane,lapProgress);
      addParticles(p.x,p.y,"#72e5ff",18);
      playerLane=destination;
      f.used=true;
    }
  }
}

function isInSlowZone() {
  for(const f of fences){
    if(!f.slow || f.lane!==playerLane)continue;
    const distance=normalizeDelta(lapProgress,f.s);
    const zone=normalizeDelta(f.slowEnd,f.s);
    if(distance<=zone)return true;
  }
  return false;
}

function spawnObstacle() {
  const difficulty=Math.min(1,elapsed/150);
  const typeRoll=Math.random();
  let type="rock";

  if(elapsed>25 && typeRoll<0.22)type="thorn";
  else if(elapsed>50 && typeRoll<0.38)type="log";
  else if(elapsed>35 && typeRoll<0.55)type="wheel";

  let lane=Math.floor(rand(0,3));
  let s=(lapProgress+rand(.12,.72))%1;

  if(type==="thorn")lane=0;
  if(type==="wheel")lane=1;

  obstacles.push({
    type,lane,s,
    angle:rand(0,Math.PI*2),
    phase:rand(0,Math.PI*2),
    speed:rand(.012,.025),
    radius:type==="rock"?13:type==="thorn"?12:type==="log"?17:20,
    active:true
  });
}

function updateObstacles(dt) {
  const interval=Math.max(1.15,3.3-elapsed*.009);
  spawnTimer-=dt;
  if(spawnTimer<=0){
    spawnObstacle();
    if(elapsed>45 && Math.random()<.28)spawnObstacle();
    spawnTimer=interval*rand(.75,1.2);
  }

  wheelAngle+=dt*2.2;

  for(const o of obstacles){
    if(!o.active)continue;
    o.phase+=dt*o.speed*5;

    if(o.type==="thorn"){
      // 外側から水路へ入り込む
      o.s=(o.s+dt*.018)%1;
    }
  }

  const p=pathPoint(playerLane,lapProgress);
  for(const o of obstacles){
    if(!o.active)continue;

    let collision=false;
    const ds=Math.abs(normalizeDelta(o.s,lapProgress));
    const around=Math.min(ds,1-ds);

    if(o.type==="wheel"){
      // 水車は中央レーンを中心に回転。接触範囲に入ると危険
      if(around<.012 && Math.abs(o.lane-playerLane)<1){
        const safePhase=Math.sin(wheelAngle+o.phase);
        collision=Math.abs(safePhase)<.62;
      }
    }else if(o.type==="thorn"){
      const currentLane=clamp(Math.round(0+(Math.sin(o.phase)*.45+.5)*1),0,1);
      collision=around<.009 && playerLane===currentLane;
    }else{
      collision=around<.009 && playerLane===o.lane;
    }

    if(collision){
      addParticles(p.x,p.y,"#ff7b69",25);
      endGame();
      return;
    }
  }

  obstacles=obstacles.filter(o=>Math.min(normalizeDelta(o.s,lapProgress),normalizeDelta(lapProgress,o.s))<.48);
}

function update(dt) {
  elapsed+=dt;

  // 周回ごとの目標タイムを段階的に更新
  updateLapSpeed();

  let speedMultiplier=isInSlowZone()?.58:1;
  const progressRate=dt/(lapTime/speedMultiplier);
  lapProgress+=progressRate;
  totalProgress+=progressRate;

  while(lapProgress>=1){
    lapProgress-=1;
    lapCount++;
    lapTime=lapTimeForLap(lapCount);
  }

  // 柵の有効期限は、その時点の周回時間の半分
  for(const f of fences)f.age+=dt;
  fences=fences.filter(f=>f.age<lapTime*.5);

  resolveFenceAtPlayer();

  const p=pathPoint(playerLane,lapProgress);
  player.x=p.x;
  player.y=p.y;
  player.angle=p.angle;

  updateObstacles(dt);

  for(const particle of particles){
    particle.x+=particle.vx*dt;
    particle.y+=particle.vy*dt;
    particle.vx*=Math.pow(.08,dt);
    particle.vy*=Math.pow(.08,dt);
    particle.life-=dt;
  }
  particles=particles.filter(p=>p.life>0);

  updateUI();
}

function drawTrack() {
  // 中央の陸地
  ctx.fillStyle="#263b36";
  ctx.beginPath();
  ctx.roundRect(CX-155,CY-155,310,310,48);
  ctx.fill();

  // 水路の背景
  ctx.strokeStyle="#183e50";
  ctx.lineWidth=126;
  ctx.lineCap="round";
  ctx.lineJoin="round";
  const p=paths[1];
  ctx.beginPath();
  p.pts.forEach((pt,i)=>{
    if(i===0)ctx.moveTo(pt.x+CX,pt.y+CY);
    else ctx.lineTo(pt.x+CX,pt.y+CY);
  });
  ctx.closePath();
  ctx.stroke();

  // 3レーン
  for(let lane=0;lane<3;lane++){
    const path=paths[lane];
    ctx.beginPath();
    path.pts.forEach((pt,i)=>{
      if(i===0)ctx.moveTo(pt.x+CX,pt.y+CY);
      else ctx.lineTo(pt.x+CX,pt.y+CY);
    });
    ctx.closePath();
    ctx.strokeStyle=lane===1?"#3c8195":"#2c6479";
    ctx.lineWidth=3;
    ctx.stroke();

    // レーンの水流表現
    for(let k=0;k<16;k++){
      const s=(k/16+elapsed*.018)%1;
      const q=pathPoint(lane,s);
      ctx.fillStyle="#8bdfff";
      ctx.globalAlpha=.18;
      ctx.beginPath();
      ctx.arc(q.x,q.y,2.2,0,Math.PI*2);
      ctx.fill();
    }
  }
  ctx.globalAlpha=1;

  // 中央の装飾
  ctx.fillStyle="#39564b";
  ctx.font="bold 20px Arial";
  ctx.textAlign="center";
  ctx.fillText("LAND",CX,CY+7);
  ctx.fillStyle="#688b76";
  ctx.font="12px Arial";
  ctx.fillText("WATER FLOW",CX,CY+28);
}

function drawFences() {
  for(const f of fences){
    const p=pathPoint(f.lane,f.s);
    const alpha=clamp(1-f.age/(lapTime*.5),.2,1);
    const path=paths[f.lane];
    const tangent=p.angle;
    const nx=-Math.sin(tangent),ny=Math.cos(tangent);

    ctx.save();
    ctx.globalAlpha=alpha;
    ctx.translate(p.x,p.y);
    ctx.rotate(tangent);

    // 柵本体
    ctx.fillStyle=f.slow?"#65d8ff":"#f5e6a5";
    ctx.shadowColor=f.slow?"#65d8ff":"#fff0ad";
    ctx.shadowBlur=12;
    ctx.fillRect(-17,-5,34,10);
    ctx.fillStyle="#ffffff";
    ctx.fillRect(-13,-3,5,6);
    ctx.fillRect(8,-3,5,6);

    ctx.restore();
    ctx.globalAlpha=1;
  }
}

function drawObstacles() {
  for(const o of obstacles){
    if(!o.active)continue;
    const p=pathPoint(o.lane,o.s);
    ctx.save();
    ctx.translate(p.x,p.y);

    if(o.type==="rock"){
      ctx.fillStyle="#9aa5ad";
      ctx.strokeStyle="#d0d7dc";
      ctx.lineWidth=2;
      ctx.beginPath();
      ctx.moveTo(-13,-8);ctx.lineTo(-5,-15);ctx.lineTo(10,-11);
      ctx.lineTo(15,3);ctx.lineTo(5,14);ctx.lineTo(-11,10);
      ctx.closePath();ctx.fill();ctx.stroke();
    }else if(o.type==="thorn"){
      ctx.rotate(o.phase);
      ctx.fillStyle="#e1a1d5";
      ctx.strokeStyle="#ffe0f8";
      ctx.lineWidth=2;
      for(let i=0;i<8;i++){
        const a=i*Math.PI/4;
        ctx.beginPath();
        ctx.moveTo(Math.cos(a)*5,Math.sin(a)*5);
        ctx.lineTo(Math.cos(a)*18,Math.sin(a)*18);
        ctx.lineTo(Math.cos(a+.3)*5,Math.sin(a+.3)*5);
        ctx.closePath();ctx.fill();ctx.stroke();
      }
      ctx.beginPath();ctx.arc(0,0,9,0,Math.PI*2);
      ctx.fillStyle="#d46bbd";ctx.fill();
    }else if(o.type==="log"){
      ctx.rotate(.4);
      ctx.fillStyle="#9b6941";
      ctx.strokeStyle="#d4a06d";
      ctx.lineWidth=3;
      ctx.beginPath();ctx.roundRect(-20,-8,40,16,7);ctx.fill();ctx.stroke();
      ctx.beginPath();ctx.arc(-14,0,5,0,Math.PI*2);ctx.stroke();
    }else if(o.type==="wheel"){
      ctx.rotate(wheelAngle+o.phase);
      ctx.strokeStyle="#e8bd65";
      ctx.lineWidth=5;
      ctx.beginPath();ctx.arc(0,0,18,0,Math.PI*2);ctx.stroke();
      for(let i=0;i<4;i++){
        ctx.rotate(Math.PI/2);
        ctx.fillStyle="#dba94f";
        ctx.fillRect(-3,-22,6,44);
      }
      ctx.fillStyle="#fff0b8";
      ctx.beginPath();ctx.arc(0,0,5,0,Math.PI*2);ctx.fill();
    }
    ctx.restore();
  }
}

function drawPlayer() {
  const p=pathPoint(playerLane,lapProgress);
  ctx.save();
  ctx.translate(p.x,p.y);
  ctx.rotate(p.angle);

  // 水しぶき
  ctx.fillStyle="#55d8ff";
  ctx.globalAlpha=.35;
  ctx.beginPath();ctx.ellipse(-13,0,19,10,0,0,Math.PI*2);ctx.fill();
  ctx.globalAlpha=1;

  // キャラクター
  ctx.fillStyle="#ffe16d";
  ctx.strokeStyle="#fff5c5";
  ctx.lineWidth=3;
  ctx.beginPath();ctx.arc(0,0,10,0,Math.PI*2);ctx.fill();ctx.stroke();

  ctx.fillStyle="#24313a";
  ctx.beginPath();ctx.arc(3,-3,2,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(3,3,2,0,Math.PI*2);ctx.fill();

  ctx.restore();
}

function drawParticles() {
  for(const p of particles){
    ctx.globalAlpha=clamp(p.life/p.max,0,1);
    ctx.fillStyle=p.color;
    ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;
}

function draw() {
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle="#14232d";
  ctx.fillRect(0,0,W,H);

  drawTrack();
  drawFences();
  drawObstacles();
  drawPlayer();
  drawParticles();

  // 周回方向表示
  ctx.fillStyle="#8ebdce";
  ctx.font="12px Arial";
  ctx.textAlign="center";
  ctx.fillText("CLICK / TAP TO PLACE FENCE",350,28);
}

function loop(now) {
  if(!running)return;
  const dt=Math.min((now-lastTime)/1000,.04);
  lastTime=now;

  update(dt);
  draw();

  if(running)requestAnimationFrame(loop);
}

function canvasPosition(e) {
  const rect=canvas.getBoundingClientRect();
  return {
    x:(e.clientX-rect.left)/rect.width*W,
    y:(e.clientY-rect.top)/rect.height*H
  };
}

canvas.addEventListener("pointerdown",e=>{
  if(!running)return;
  e.preventDefault();
  const p=canvasPosition(e);
  placeFence(p.x,p.y);
});

document.getElementById("startBtn").addEventListener("click",startGame);

function init() {
  paths=[
    makeRoundedPath(LANE[0].half,LANE[0].radius),
    makeRoundedPath(LANE[1].half,LANE[1].radius),
    makeRoundedPath(LANE[2].half,LANE[2].radius)
  ];
  const p=pathPoint(1,0);
  player.x=p.x;player.y=p.y;
  draw();
}
init();

})();
</script>
</body>
</html>
